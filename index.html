<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alphard Tracker</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;500&family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Source Sans 3', sans-serif; background: #f8f6f1; color: #1e2a3a; }
    .mono { font-family: 'JetBrains Mono', monospace; }

    /* Colours */
    :root {
      --navy: #1e2a3a;
      --amber: #d4a843;
      --cream: #f8f6f1;
      --red: #c0392b;
      --green: #27ae60;
      --orange: #e67e22;
    }

    /* Layout */
    .container { max-width: 1100px; margin: 0 auto; padding: 16px; }
    .tabs { display: flex; gap: 0; border-bottom: 3px solid var(--navy); margin-bottom: 24px; }
    .tab { padding: 10px 24px; cursor: pointer; font-weight: 600; font-size: 15px;
           background: transparent; border: none; color: var(--navy); opacity: 0.5;
           border-bottom: 3px solid transparent; margin-bottom: -3px; transition: all 0.15s; }
    .tab:hover { opacity: 0.8; }
    .tab.active { opacity: 1; border-bottom-color: var(--amber); }

    /* Card */
    .card { background: #fff; border-radius: 8px; overflow: hidden; margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .card-header { background: var(--navy); color: #fff; padding: 12px 20px;
                   display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 4px; font-size: 13px; font-weight: 600; }
    .badge-amber { background: var(--amber); color: var(--navy); }
    .badge-drive { background: rgba(255,255,255,0.15); color: #fff; }
    .badge-verdict { cursor: pointer; user-select: none; }
    .badge-pass { background: var(--red); color: #fff; }
    .badge-investigating { background: var(--orange); color: #fff; }
    .badge-shortlisted { background: var(--green); color: #fff; }
    .card-header { cursor: pointer; user-select: none; }
    .card-header h2 { font-size: 18px; font-weight: 600; flex: 1; }
    .card-header .collapse-arrow { font-size: 12px; opacity: 0.5; transition: transform 0.2s; margin-right: 4px; }
    .card-header .collapse-arrow.open { transform: rotate(90deg); }
    .card.collapsed { opacity: 0.7; }
    .card.collapsed .card-header { border-radius: 8px; }

    .card-body { display: flex; gap: 16px; padding: 16px 20px; }
    .card-cover { position: relative; flex-shrink: 0; width: 240px; cursor: pointer; }
    .card-cover img { width: 100%; height: 180px; object-fit: cover; border-radius: 6px; background: #e0ddd6; }
    .card-cover .photo-bar { position: absolute; bottom: 8px; right: 8px; display: flex; gap: 4px; align-items: center; }
    .card-cover .photo-count { background: rgba(0,0,0,0.7); color: #fff; padding: 2px 8px;
                               border-radius: 4px; font-size: 12px; }
    .card-cover .photo-manage-btn { background: rgba(0,0,0,0.7); color: var(--amber); padding: 2px 8px;
                                     border-radius: 4px; font-size: 12px; border: none; cursor: pointer;
                                     font-weight: 600; }
    .card-cover .photo-manage-btn:hover { background: rgba(0,0,0,0.85); }
    .card-cover .photo-count-badge { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.7);
                                      color: #fff; font-size: 11px; font-weight: 700; padding: 2px 7px;
                                      border-radius: 10px; pointer-events: none; }
    .card-specs { flex: 1; min-width: 0; }

    .spec-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px 12px; margin-bottom: 8px; }
    .spec-item label { display: block; font-size: 11px; text-transform: uppercase; color: #888; font-weight: 600; letter-spacing: 0.5px; }
    .spec-item span { font-size: 14px; font-weight: 600; }
    .spec-item .editable-val { cursor: pointer; border-bottom: 1px dashed transparent; transition: border-color 0.15s; }
    .spec-item .editable-val:hover { border-bottom-color: var(--amber); }
    .spec-item .editable-val.is-tbc { color: #bbb; font-style: italic; }
    .edit-input { font-size: 14px; font-weight: 600; font-family: inherit; border: 1px solid var(--amber);
                  border-radius: 3px; padding: 1px 4px; width: 100%; outline: none; background: #fffdf5; }
    .spec-item .beige-warning { color: var(--red); font-weight: 700; }
    .spec-item .chassis-val { font-family: 'JetBrains Mono', monospace; font-size: 12px; }

    .card-summary { font-size: 14px; color: #555; margin-bottom: 8px; }
    .details-link { color: var(--amber); cursor: pointer; font-size: 14px; font-weight: 600; border: none; background: none; }
    .details-link:hover { text-decoration: underline; }

    .outstanding-box { margin-top: 12px; padding: 10px 14px; background: #fff8e7; border-left: 3px solid var(--amber);
                       border-radius: 0 4px 4px 0; font-size: 13px; }
    .outstanding-box strong { display: block; margin-bottom: 4px; font-size: 12px; text-transform: uppercase; color: var(--amber); }

    /* Photo management */
    .photo-manage-toggle { margin: 0 20px 12px; padding: 6px 14px; font-size: 13px; cursor: pointer;
                           background: var(--cream); border: 1px solid #ddd; border-radius: 4px; font-weight: 600; }
    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px;
                  padding: 0 20px 20px; }
    .photo-thumb { position: relative; border-radius: 4px; overflow: hidden; cursor: pointer; }
    .photo-thumb img { width: 100%; height: 90px; object-fit: cover; display: block; }
    .photo-thumb.is-cover { outline: 3px solid var(--amber); outline-offset: -3px; }
    .photo-thumb .cover-label { position: absolute; top: 4px; left: 4px; background: var(--amber);
                                 color: var(--navy); font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 2px; }
    .photo-thumb .set-cover-btn { position: absolute; bottom: 4px; left: 4px; background: rgba(0,0,0,0.7);
                                   color: var(--amber); border: none; font-size: 11px; padding: 2px 6px;
                                   border-radius: 2px; cursor: pointer; }
    .photo-thumb .del-btn { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.7);
                             color: #fff; border: none; font-size: 14px; width: 22px; height: 22px;
                             border-radius: 50%; cursor: pointer; line-height: 20px; text-align: center; }
    .no-photos { color: #999; font-size: 14px; padding: 0 20px 20px; }

    /* Lightbox */
    .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 1000;
                display: flex; align-items: center; justify-content: center; }
    .lightbox img { max-width: 90vw; max-height: 85vh; object-fit: contain; border-radius: 4px; }
    .lightbox-close { position: absolute; top: 16px; right: 20px; color: #fff; font-size: 32px;
                      cursor: pointer; background: none; border: none; z-index: 1001; }
    .lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); color: #fff; font-size: 48px;
                    cursor: pointer; background: none; border: none; padding: 0 20px; z-index: 1001; user-select: none; }
    .lightbox-nav.prev { left: 0; }
    .lightbox-nav.next { right: 0; }
    .lightbox-counter { position: absolute; bottom: 20px; color: rgba(255,255,255,0.7); font-size: 14px; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 900;
                     display: flex; align-items: center; justify-content: center; }
    .modal { background: #fff; border-radius: 8px; max-width: 700px; width: 90%; max-height: 80vh;
             overflow-y: auto; padding: 28px; position: relative; }
    .modal h2 { margin-bottom: 16px; }
    .modal-close { position: absolute; top: 12px; right: 16px; font-size: 24px; cursor: pointer;
                   background: none; border: none; color: #888; }
    .modal p { margin-bottom: 10px; font-size: 15px; line-height: 1.6; }
    .modal .outstanding-section { margin-top: 16px; }

    /* Questions table */
    .q-table { width: 100%; border-collapse: collapse; }
    .q-table th { text-align: left; padding: 8px 12px; background: var(--navy); color: #fff; font-size: 13px; }
    .q-table td { padding: 10px 12px; border-bottom: 1px solid #eee; font-size: 14px; }
    .q-table tr:hover { background: #faf8f3; }
    .status-badge { cursor: pointer; user-select: none; display: inline-block; padding: 2px 10px;
                    border-radius: 4px; font-size: 12px; font-weight: 600; }
    .status-to_ask { background: #e8e8e8; color: #555; }
    .status-awaiting { background: #fef3cd; color: #856404; }
    .status-resolved { background: #d4edda; color: var(--green); }
    .add-q-btn { margin-top: 12px; padding: 8px 16px; background: var(--navy); color: #fff;
                 border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: 600; }

    /* Target spec */
    .spec-table { width: 100%; border-collapse: collapse; }
    .spec-table td { padding: 10px 14px; border-bottom: 1px solid #eee; font-size: 14px; }
    .spec-table td:first-child { font-weight: 600; width: 160px; color: var(--navy); }
    .spec-table tr.bold-row td { font-weight: 700; }

    /* Add question modal */
    .add-q-form label { display: block; font-weight: 600; margin-bottom: 4px; margin-top: 12px; font-size: 14px; }
    .add-q-form input, .add-q-form textarea { width: 100%; padding: 8px 10px; border: 1px solid #ccc;
                                                border-radius: 4px; font-size: 14px; font-family: inherit; }
    .add-q-form textarea { min-height: 80px; resize: vertical; }
    .add-q-form button { margin-top: 16px; padding: 8px 20px; background: var(--navy); color: #fff;
                          border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }

    /* Extra stats toggle */
    .extra-stats-toggle { background: none; border: 1px solid #ddd; border-radius: 4px; padding: 4px 12px;
                          font-size: 12px; font-weight: 600; cursor: pointer; color: #888; margin-bottom: 8px; }
    .extra-stats-toggle:hover { border-color: var(--amber); color: var(--navy); }

    /* Car questions/notes section */
    .car-qn-section { margin: 0 20px 16px; }
    .car-qn-toggle { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: #faf8f3;
                     border: 1px solid #eee; border-radius: 6px; cursor: pointer; width: 100%;
                     font-size: 13px; font-weight: 600; color: var(--navy); text-transform: uppercase;
                     letter-spacing: 0.5px; }
    .car-qn-toggle:hover { background: #f5f2eb; border-color: #ddd; }
    .car-qn-toggle .toggle-arrow { font-size: 10px; color: #999; transition: transform 0.15s; }
    .car-qn-toggle .toggle-arrow.open { transform: rotate(90deg); }
    .car-qn-toggle .qn-counts { font-size: 11px; font-weight: 400; color: #999; text-transform: none;
                                 letter-spacing: 0; margin-left: auto; }
    .car-qn-body { border: 1px solid #eee; border-top: none; border-radius: 0 0 6px 6px; background: #faf8f3;
                   padding: 12px 14px; }
    .car-qn-body h5 { font-size: 11px; text-transform: uppercase; color: #999; margin-bottom: 6px;
                       letter-spacing: 0.5px; }
    .car-q-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid #eee;
                 font-size: 13px; }
    .car-q-row:last-of-type { border-bottom: none; }
    .car-q-row.resolved { opacity: 0.5; }
    .car-q-topic { font-weight: 600; min-width: 100px; flex-shrink: 0; }
    .car-q-text { flex: 1; }
    .car-q-del { background: none; border: none; color: #ccc; cursor: pointer; font-size: 16px; padding: 0 4px;
                 line-height: 1; }
    .car-q-del:hover { color: var(--red); }
    .car-q-add { margin-top: 8px; padding: 4px 12px; background: var(--navy); color: #fff; border: none;
                 border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; }
    .car-notes-area { width: 100%; min-height: 60px; padding: 8px 10px; border: 1px solid #e0ddd6;
                      border-radius: 4px; font-size: 13px; font-family: inherit; resize: vertical;
                      background: #fff; color: var(--navy); margin-top: 4px; }
    .car-notes-area:focus { outline: none; border-color: var(--amber); }
    .car-notes-divider { border: none; border-top: 1px solid #e0ddd6; margin: 10px 0; }

    /* Inline gallery */
    .inline-gallery { padding: 0 20px 12px; }
    .inline-gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 6px; }
    .inline-gallery-grid img { width: 100%; height: 100px; object-fit: cover; border-radius: 4px; cursor: pointer;
                                transition: opacity 0.15s; }
    .inline-gallery-grid img:hover { opacity: 0.85; }

    /* Heatmap spec colouring */
    .spec-heat-good { color: #1a8a3e; }
    .spec-heat-ok { color: #7a8a1a; }
    .spec-heat-warn { color: #b87a1a; }
    .spec-heat-bad { color: #c0392b; }
    .spec-heat-tbc { color: #bbb; }

    /* SPECS tab */
    .specs-gen-header { background: var(--navy); color: #fff; padding: 10px 16px; font-size: 16px;
                        font-weight: 700; border-radius: 6px 6px 0 0; margin-top: 20px; }
    .specs-gen-header:first-of-type { margin-top: 0; }
    .specs-variant-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; background: #fff;
                           box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-radius: 0 0 6px 6px; overflow: hidden; }
    .specs-variant-table th { text-align: left; padding: 8px 12px; background: #f0ede6; font-size: 12px;
                              text-transform: uppercase; color: #888; font-weight: 600; letter-spacing: 0.5px; }
    .specs-variant-table td { padding: 8px 12px; border-bottom: 1px solid #eee; font-size: 13px; }
    .specs-variant-table tr:hover { background: #faf8f3; }
    .specs-variant-table tr.highlight-gold { background: #fff8e1; }
    .specs-variant-table tr.highlight-gold:hover { background: #fff3cc; }
    .specs-variant-table .chassis-code { font-family: 'JetBrains Mono', monospace; font-size: 12px; }

    /* Responsive */
    @media (max-width: 768px) {
      .card-body { flex-direction: column; }
      .card-cover { width: 100%; }
      .card-cover img { height: 220px; }
      .spec-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .header-bar { background: var(--navy); color: #fff; padding: 20px; margin-bottom: 0; text-align: center; }
    .header-bar h1 { font-size: 24px; font-weight: 700; }
    .header-bar p { font-size: 14px; opacity: 0.7; margin-top: 4px; }
    .header-bar .reset-link { color: rgba(255,255,255,0.4); font-size: 12px; cursor: pointer;
                               background: none; border: none; margin-top: 6px; }
    .header-bar .reset-link:hover { color: rgba(255,255,255,0.7); }

    /* GitHub sync */
    .header-actions { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 8px; }
    .gh-settings-btn { background: rgba(255,255,255,0.15); border: none; color: #fff; padding: 4px 12px;
                       border-radius: 4px; font-size: 13px; cursor: pointer; font-family: inherit; }
    .gh-settings-btn:hover { background: rgba(255,255,255,0.25); }
    .gh-settings-btn.connected { background: rgba(39,174,96,0.3); }
    .gh-modal input { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px;
                      font-size: 14px; font-family: 'JetBrains Mono', monospace; margin: 8px 0; }
    .gh-modal p { font-size: 13px; color: #666; }
    .gh-modal .btn-row { display: flex; gap: 8px; margin-top: 16px; }
    .gh-modal .btn-row button { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer;
                                 font-weight: 600; font-size: 14px; }
    .gh-modal .btn-save { background: var(--navy); color: #fff; }
    .gh-modal .btn-clear { background: #eee; color: var(--red); }

    .save-gh-btn { margin: 0 20px 12px; padding: 6px 14px; font-size: 13px; cursor: pointer;
                   background: var(--green); color: #fff; border: none; border-radius: 4px; font-weight: 600; }
    .save-gh-btn:hover { background: #219a52; }
    .save-gh-btn:disabled { background: #ccc; cursor: not-allowed; }
    .save-gh-btn.saving { background: var(--orange); }
    .save-status { font-size: 12px; margin-left: 8px; }
    .dirty-indicator { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
                       background: var(--orange); margin-left: 8px; vertical-align: middle; }

    /* Edited field indicator */
    .editable-val.is-edited { border-bottom: 1px dashed var(--amber); }
    .edit-marker { display: inline-block; width: 6px; height: 6px; border-radius: 50;
                   background: var(--amber); margin-left: 4px; vertical-align: middle; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    // ── Config ──────────────────────────────────────────────
    const REPO = "polytroniq/alphard-search";

          { chassis: "AAHH45W", engine: "2.5 Hybrid (A25A-FXS)", power: "197 PS system", drivetrain: "E-Four", transmission: "CVT (hybrid)", seats: "7/8", dimensions: "4995×1850×1935", weight: "2120 kg", notes: "Hybrid E-Four 4WD" }

    function imageUrl(car, filename) {
      return `${RAW_BASE}/cars/${car.id}/photos/${filename}`;
    }

    // ── Lightbox ────────────────────────────────────────────
    function Lightbox({ images, startIndex, onClose }) {
      const [idx, setIdx] = useState(startIndex);
      const go = useCallback((d) => setIdx(i => (i + d + images.length) % images.length), [images.length]);

      useEffect(() => {
        function onKey(e) {
          if (e.key === "Escape") onClose();
          if (e.key === "ArrowLeft") go(-1);
          if (e.key === "ArrowRight") go(1);
        }
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, [go, onClose]);

      return (
        <div className="lightbox" onClick={onClose}>
          <button className="lightbox-close" onClick={onClose}>&times;</button>
          <button className="lightbox-nav prev" onClick={e => { e.stopPropagation(); go(-1); }}>&lsaquo;</button>
          <img src={images[idx]} onClick={e => e.stopPropagation()} alt="" />
          <button className="lightbox-nav next" onClick={e => { e.stopPropagation(); go(1); }}>&rsaquo;</button>
          <div className="lightbox-counter">{idx + 1} / {images.length}</div>
        </div>
      );
    }

    // ── Editable Field ─────────────────────────────────────
    function EditableField({ value, onChange, className, originalValue }) {
      const [editing, setEditing] = useState(false);
      const [draft, setDraft] = useState(value);

      const commit = () => {
        setEditing(false);
        if (draft.trim() !== value) onChange(draft.trim());
      };

      if (editing) {
        return (
          <input
            className="edit-input"
            value={draft}
            onChange={e => setDraft(e.target.value)}
            onBlur={commit}
            onKeyDown={e => { if (e.key === "Enter") commit(); if (e.key === "Escape") { setDraft(value); setEditing(false); } }}
            autoFocus
          />
        );
      }

      const isTbc = value === "TBC" || value === "";
      const isEdited = originalValue !== undefined && originalValue !== value;
      const tooltip = isEdited
        ? `Originally: ${originalValue || "(empty)"}\nClick to edit`
        : "Click to edit";

      return (
        <span
          className={`editable-val${isTbc ? " is-tbc" : ""}${isEdited ? " is-edited" : ""}${className ? " " + className : ""}`}
          onClick={() => { setDraft(value); setEditing(true); }}
          title={tooltip}
        >
          {isTbc ? "TBC" : value}
        </span>
      );
    }

    // ── Spec Heatmap scoring ────────────────────────────────
    // Returns a CSS class based on how well a car's field matches the target spec.
    // "good" = matches target, "ok" = acceptable, "warn" = concern, "bad" = doesn't match
    function specHeatClass(field, value) {
      if (!value || value === "TBC" || value === "") return "spec-heat-tbc";
      const v = value.toLowerCase().trim();

      switch (field) {
        case "engine": {
          if (v.includes("3.5") || v.includes("v6")) return "spec-heat-good";
          if (v.includes("2.5") || v.includes("2.4")) return "spec-heat-bad";
          return "spec-heat-tbc";
        }
        case "drivetrain": {
          if (v === "tbc") return "spec-heat-tbc";
          // Both 2WD and 4WD acceptable, 4WD is a bonus
          if (v.includes("4wd")) return "spec-heat-good";
          if (v.includes("2wd")) return "spec-heat-ok";
          return "spec-heat-tbc";
        }
        case "interior": {
          if (v.includes("black") || v.includes("dark")) return "spec-heat-good";
          if (v.includes("beige") || v.includes("cream")) return "spec-heat-warn";
          if (v.includes("cloth")) return "spec-heat-ok";
          return "spec-heat-tbc";
        }
        case "colour": {
          if (v.includes("black")) return "spec-heat-good";
          if (v.includes("white") || v.includes("pearl") || v.includes("silver")) return "spec-heat-ok";
          return "spec-heat-ok";
        }
        case "sunroof": {
          if (v.includes("twin") && !v.includes("tbc")) return "spec-heat-good";
          if (v.includes("yes") || v.includes("listed")) return "spec-heat-ok";
          if (v.includes("no") || v.includes("none")) return "spec-heat-bad";
          return "spec-heat-tbc";
        }
        case "ottomans": {
          if (v.includes("yes") || v.includes("powered") || v.includes("premium")) return "spec-heat-good";
          if (v.includes("no")) return "spec-heat-bad";
          return "spec-heat-tbc";
        }
        case "wheels": {
          if (v.includes("stock") || v.includes("standard") || v.includes("factory")) return "spec-heat-good";
          if (v.includes("aftermarket") || v.includes("lowered")) return "spec-heat-bad";
          return "spec-heat-tbc";
        }
        case "mileage": {
          // Extract numeric miles
          const miMatch = v.match(/([\d,]+)\s*mi/);
          const kmMatch = v.match(/([\d,]+)\s*km/);
          let miles = 0;
          if (miMatch) miles = parseInt(miMatch[1].replace(/,/g, ""));
          else if (kmMatch) miles = parseInt(kmMatch[1].replace(/,/g, "")) * 0.621;
          if (miles === 0) return "spec-heat-tbc";
          if (miles < 50000) return "spec-heat-good";
          if (miles < 70000) return "spec-heat-ok";
          if (miles < 90000) return "spec-heat-warn";
          return "spec-heat-bad";
        }
        case "price": {
          const priceMatch = v.match(/[\d,]+/);
          if (!priceMatch) return "spec-heat-tbc";
          const price = parseInt(priceMatch[0].replace(/,/g, ""));
          if (price <= 13000) return "spec-heat-good";
          if (price <= 14000) return "spec-heat-ok";
          if (price <= 15000) return "spec-heat-warn";
          return "spec-heat-bad";
        }
        case "seats": {
          if (v === "7") return "spec-heat-good";
          if (v === "8") return "spec-heat-ok";
          return "spec-heat-tbc";
        }
        default:
          return "";
      }
    }

    // ── Car Card ────────────────────────────────────────────
    function CarCard({ car, onVerdictCycle, onSetCover, onDeleteImage, onUpdateField, isDirty, onSaveToGitHub, hasPat, onCarQuestionStatusCycle, onAddCarQuestion, onDeleteCarQuestion, onUpdateCarNotes }) {
      const orig = car._original || {};
      // Editable field with heatmap colouring — default empty/undefined to TBC
      const ef = (field, extraClass) => {
        const val = car[field] || "TBC";
        const heatClass = specHeatClass(field, val);
        const cls = [extraClass, heatClass].filter(Boolean).join(" ");

          <EditableField value={val} onChange={v => onUpdateField(car.id, field, v)} className={cls} originalValue={orig[field]} />

        ? imageUrl(car, car.images[car.coverImage || 0])

            <span className="badge badge-drive">{car.drivetrain}</span>

            {isDirty && <span className="dirty-indicator" title="Unsaved changes" />}
            {collapsed && car.price && <span style={{ fontSize: 13, opacity: 0.7, marginLeft: 4 }}>{car.price}</span>}
          </div>

          {!collapsed && <><div className="card-body">
            <div className="card-cover" onClick={() => coverSrc && setShowGallery(!showGallery)}>
              {coverSrc
                ? <><img src={coverSrc} alt={car.name} />
                    <span className="photo-count-badge">{car.images.length}</span></>
                : <div style={{ width: "100%", height: 180, background: "#e0ddd6", borderRadius: 6,
                                display: "flex", alignItems: "center", justifyContent: "center", color: "#999" }}>No photos</div>
              }

                <div className="spec-item"><label>Year</label>{ef("date")}</div>
                <div className="spec-item"><label>Drive</label>{ef("drivetrain")}</div>

                <div className="spec-item"><label>Colour</label>{ef("colour")}</div>
                <div className="spec-item"><label>Seats</label>{ef("seats")}</div>
                <div className="spec-item"><label>Chassis</label>{ef("chassis", "chassis-val")}</div>
                <div className="spec-item"><label>Engine</label>{ef("engine")}</div>

                <div className="spec-item"><label>Interior</label>{ef("interior")}</div>
                <div className="spec-item"><label>Sunroof</label>{ef("sunroof")}</div>
                <div className="spec-item"><label>Ottomans</label>{ef("ottomans")}</div>
                <div className="spec-item"><label>Wheels</label>{ef("wheels")}</div>
              </div>

              <button className="extra-stats-toggle" onClick={() => setShowExtraStats(!showExtraStats)}>

              </button>

                <div className="spec-grid" style={{ marginTop: 8 }}>
                  {EXTRA_STATS_FIELDS.map(f => (
                    <div className="spec-item" key={f.key}>
                      <label>{f.label}</label>
                      <EditableField value={car[f.key] || "TBC"} onChange={v => onUpdateField(car.id, f.key, v)} />
                    </div>
                  ))}
                </div>
              )}

              <div style={{ marginTop: 8 }}>

                        onClick={() => onVerdictCycle(car.id)}>

              <p className="card-summary" style={{ marginTop: 8 }}>

              </p>
              <button className="details-link" onClick={() => setDetailModal(true)}>Full details &rarr;</button>
            </div>
          </div>

          {/* Inline photo gallery - shown when clicking cover image */}

                    <button className="set-cover-btn" onClick={() => onSetCover(car.id, i)}>&#9733; Set cover</button>
                  )}
                  <button className="del-btn" onClick={() => onDeleteImage(car.id, i)}>&times;</button>
                </div>
              ))}
            </div>
          )}
          {!car.images.length && showManage && (
            <p className="no-photos">No photos yet. Upload images to <code className="mono">cars/{car.id}/photos/</code> on GitHub.</p>
          )}

          <CarQuestionsNotesSection

            notes={car.carNotes || ""}

            </div>

          </>}

          )}
          {detailModal && <DetailModal car={car} onClose={() => setDetailModal(false)} />}
        </div>
      );
    }

      <div class="vf-pairs" style="margin-top:6px;">
        <div>Vellfire special editions: <strong>Platinum Selection</strong> / <strong>Platinum Selection II</strong> / <strong>Golden Eyes</strong> / <strong>Golden Eyes II</strong></div>
      </div>
    </div>
    <div class="facelift-note">
      <div class="fl-col">
        <h4>Pre-Facelift (2008&ndash;Oct 2011)</h4>
        <p>2.4L I4 and 3.5L V6 petrol only. S C-Package, G L-Package, and Royal Lounge restricted to 3.5 V6. No eco mode. No Nanoe. Hybrid S was not offered (only X, G, and their L/C sub-grades got hybrid post-FL).</p>
      </div>
      <div class="fl-col">
        <h4>Facelift (Nov 2011&ndash;2015)</h4>
        <p>Added 2.4L Hybrid (E-Four) across most trims. Eco mode on petrol models. S C-Package, G L-Package &amp; Royal Lounge opened to hybrid and (where applicable) 2.4 petrol. Note: G L-Package still not available as 2.4 petrol. Hybrid S renamed SR/ZR with cruise control &amp; Nanoe standard. Refreshed styling, improved materials, Nanoe on most grades.</p>
      </div>
    </div>
    <div class="engines-key">
      <div class="engine-tag"><span class="engine-dot i4"></span> 2.4L I4 (2AZ-FE) &middot; 170hp &middot; 7-speed Super CVT-i</div>
      <div class="engine-tag"><span class="engine-dot v6"></span> 3.5L V6 (2GR-FE) &middot; 280hp &middot; 6-speed auto</div>
      <div class="engine-tag"><span class="engine-dot hyb"></span> 2.4L Hybrid (2AZ-FXE) &middot; 150hp &middot; e-CVT &middot; E-Four AWD &middot; Facelift only</div>
    </div>
  </div>
  <div class="trims-footer">
    Your search: <strong style="color:#fff;">DBA-GGH25W &middot; 350S C-Package</strong> &mdash; 3.5L V6 (2GR-FE) &middot; 280hp &middot; 6-speed auto &middot; 4WD &middot; Dark cloth &middot; 7-seat
  </div>
</div>
`;

    function TrimsTab() {
      return (
        <div>
          <style>{TRIMS_CSS}</style>
          <div className="trims-content" dangerouslySetInnerHTML={{ __html: TRIMS_HTML }} />
        </div>
      );
    }

    // ── Target Spec Tab ─────────────────────────────────────
    function TargetSpecTab({ specs }) {
      return (
        <table className="spec-table">
          <tbody>
            {specs.map((s, i) => (
              <tr key={i} className={s.bold ? "bold-row" : ""}>
                <td>{s.label}</td>
                <td>{s.value}</td>
              </tr>
            ))}
          </tbody>
        </table>
      );
    }

    // ── Persistence ────────────────────────────────────────
    const STORAGE_KEY = "alphard-tracker-data";
    const PAT_KEY = "alphard-tracker-gh-pat";

    function saveToStorage(data) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
    }

    function loadFromStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) { return null; }
    }

    function getPat() { return localStorage.getItem(PAT_KEY) || ""; }
    function setPat(pat) { pat ? localStorage.setItem(PAT_KEY, pat) : localStorage.removeItem(PAT_KEY); }

    // ── GitHub API write ────────────────────────────────────
    async function saveCarToGitHub(car, pat) {
      const path = `cars/${car.id}/data.json`;
      // Build clean data object (exclude images which are derived from photo folder)
      const { images, ...carData } = car;
      const content = JSON.stringify(carData, null, 2) + "\n";
      const encoded = btoa(unescape(encodeURIComponent(content)));

      // Get current file SHA (cache-bust to avoid stale SHA)
      const getResp = await fetch(`${API_BASE}/${path}?ref=${BRANCH}&_=${Date.now()}`, {
        headers: { Authorization: `Bearer ${pat}` }
      });
      if (!getResp.ok) throw new Error(`Failed to read ${path}: ${getResp.status}`);
      const fileInfo = await getResp.json();

      // Update file
      const putResp = await fetch(`${API_BASE}/${path}`, {
        method: "PUT",
        headers: { Authorization: `Bearer ${pat}`, "Content-Type": "application/json" },
        body: JSON.stringify({
          message: `Update ${car.id} data via tracker`,
          content: encoded,
          sha: fileInfo.sha,
          branch: BRANCH
        })
      });
      if (!putResp.ok) {
        const err = await putResp.json().catch(() => ({}));
        throw new Error(err.message || `Failed to save ${path}: ${putResp.status}`);
      }
      return true;
    }

    // ── GitHub API write (config) ──────────────────────────
    async function saveConfigToGitHub(configData, pat) {
      const path = "data/config.json";
      const content = JSON.stringify(configData, null, 2) + "\n";
      const encoded = btoa(unescape(encodeURIComponent(content)));

      const getResp = await fetch(`${API_BASE}/${path}?ref=${BRANCH}&_=${Date.now()}`, {
        headers: { Authorization: `Bearer ${pat}` }
      });
      if (!getResp.ok) throw new Error(`Failed to read ${path}: ${getResp.status}`);
      const fileInfo = await getResp.json();

      const putResp = await fetch(`${API_BASE}/${path}`, {
        method: "PUT",
        headers: { Authorization: `Bearer ${pat}`, "Content-Type": "application/json" },
        body: JSON.stringify({
          message: "Update config via tracker",
          content: encoded,
          sha: fileInfo.sha,
          branch: BRANCH
        })
      });
      if (!putResp.ok) {
        const err = await putResp.json().catch(() => ({}));
        throw new Error(err.message || `Failed to save ${path}: ${putResp.status}`);
      }
      return true;
    }

    // ── GitHub Settings Modal ───────────────────────────────
    function GitHubSettingsModal({ onClose, currentPat, onSave }) {
      const [draft, setDraft] = useState(currentPat);
      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal gh-modal" onClick={e => e.stopPropagation()} style={{ maxWidth: 480 }}>
            <button className="modal-close" onClick={onClose}>&times;</button>
            <h2>GitHub Settings</h2>
            <p>Enter a GitHub Personal Access Token to save edits directly to the repo. The token needs <strong>repo</strong> scope.</p>
            <p>Your token is stored only in this browser's localStorage.</p>
            <input
              type="password"
              value={draft}
              onChange={e => setDraft(e.target.value)}
              placeholder="ghp_xxxxxxxxxxxxxxxxxxxx"
            />
            <div className="btn-row">
              <button className="btn-save" onClick={() => { setPat(draft.trim()); onSave(draft.trim()); onClose(); }}>Save</button>
              {currentPat && <button className="btn-clear" onClick={() => { setPat(""); onSave(""); onClose(); }}>Disconnect</button>}
            </div>
          </div>
        </div>
      );
    }

    // ── Save Button ──────────────────────────────────────────
    function SaveButton({ onSave }) {
      const [status, setStatus] = useState("idle"); // idle | saving | saved | error
      const [errMsg, setErrMsg] = useState("");

      const handleSave = async () => {
        setStatus("saving");
        try {
          await onSave();
          setStatus("saved");
          setTimeout(() => setStatus("idle"), 3000);
        } catch (e) {
          setErrMsg(e.message);
          setStatus("error");
          setTimeout(() => setStatus("idle"), 5000);
        }
      };

      return (
        <span>
          <button
            className={`save-gh-btn${status === "saving" ? " saving" : ""}`}
            onClick={handleSave}
            disabled={status === "saving"}
          >
            {status === "saving" ? "Saving..." : status === "saved" ? "Saved!" : "Save to GitHub"}
          </button>
          {status === "error" && <span className="save-status" style={{ color: "var(--red)" }}>{errMsg}</span>}
        </span>
      );
    }

    // ── App ─────────────────────────────────────────────────
    function App() {
      const [data, setData] = useState(null);
      const [tab, setTab] = useState("cars");
      const [error, setError] = useState(null);
      const [pat, setPatState] = useState(getPat());
      const [showGhSettings, setShowGhSettings] = useState(false);
      const [originalCars, setOriginalCars] = useState(null); // snapshot of cars as loaded from GitHub
      const [dirtyIds, setDirtyIds] = useState(new Set());
      const [configDirty, setConfigDirty] = useState(false);

      useEffect(() => {
        async function loadData() {
          try {
            // Load config (questions, target spec)
            const config = await fetch("data/config.json").then(r => r.json());

            // Discover car folders via GitHub API
            const apiResp = await fetch(`${API_BASE}/cars?ref=${BRANCH}`);
            if (!apiResp.ok) throw new Error("Failed to list car folders");
            const entries = await apiResp.json();
            const carFolders = entries.filter(e => e.type === "dir").map(e => e.name).sort();

            // Fetch each car's data.json
            const carPromises = carFolders.map(async (folder) => {
              try {
                const carData = await fetch(`${RAW_BASE}/cars/${folder}/data.json?_=${Date.now()}`).then(r => r.json());
                // Discover photos via GitHub API
                try {
                  const photosResp = await fetch(`${API_BASE}/cars/${folder}/photos?ref=${BRANCH}`);
                  if (photosResp.ok) {
                    const photoEntries = await photosResp.json();
                    carData.images = photoEntries.filter(e => e.type === "file" && /\.(jpe?g|png|webp|gif)$/i.test(e.name)).map(e => e.name);
                  } else {
                    carData.images = [];
                  }
                } catch (e) { carData.images = []; }
                return carData;
              } catch (e) { return null; }
            });

            const cars = (await Promise.all(carPromises)).filter(Boolean);

            // Store original snapshot for dirty detection
            setOriginalCars(JSON.parse(JSON.stringify(cars)));

            // Merge with localStorage edits
            const saved = loadFromStorage();
            if (saved) {
              const editedCars = cars.map(car => {
                const savedCar = saved.cars && saved.cars.find(c => c.id === car.id);
                return savedCar ? { ...car, ...savedCar, images: car.images } : car;
              });
              // Detect which cars were already dirty from localStorage
              const dirty = new Set();
              editedCars.forEach((ec, i) => {
                const orig = cars[i];
                if (orig && JSON.stringify({ ...ec, images: [], _original: null }) !== JSON.stringify({ ...orig, images: [], _original: null })) {
                  dirty.add(ec.id);
                }
              });
              setDirtyIds(dirty);
              setData({ ...config, cars: editedCars, questions: saved.questions || config.questions });
            } else {
              setData({ ...config, cars });
            }
          } catch (e) {
            // Fallback: try localStorage
            const saved = loadFromStorage();
            if (saved) { setData(saved); return; }
            setError(e.message);
          }
        }
        loadData();
      }, []);

      // Auto-save to localStorage on any change
      useEffect(() => {
        if (data) saveToStorage(data);
      }, [data]);

      const cycleVerdict = useCallback((carId) => {
        setDirtyIds(prev => new Set([...prev, carId]));
        setData(prev => ({
          ...prev,
          cars: prev.cars.map(c =>
            c.id === carId
              ? { ...c, verdict: VERDICT_CYCLE[(VERDICT_CYCLE.indexOf(c.verdict) + 1) % VERDICT_CYCLE.length] }
              : c
          )
        }));
      }, []);

      const setCover = useCallback((carId, idx) => {
        setDirtyIds(prev => new Set([...prev, carId]));
        setData(prev => ({
          ...prev,
          cars: prev.cars.map(c => c.id === carId ? { ...c, coverImage: idx } : c)
        }));
      }, []);

      const deleteImage = useCallback((carId, idx) => {
        setData(prev => ({
          ...prev,
          cars: prev.cars.map(c => {
            if (c.id !== carId) return c;
            const newImages = c.images.filter((_, i) => i !== idx);
            let newCover = c.coverImage || 0;
            if (idx === newCover) newCover = 0;
            else if (idx < newCover) newCover--;
            return { ...c, images: newImages, coverImage: newCover };
          })
        }));
      }, []);

      const cycleStatus = useCallback((qIdx) => {
        setConfigDirty(true);
        setData(prev => ({
          ...prev,
          questions: prev.questions.map((q, i) =>
            i === qIdx
              ? { ...q, status: STATUS_CYCLE[(STATUS_CYCLE.indexOf(q.status) + 1) % STATUS_CYCLE.length] }
              : q
          )
        }));
      }, []);

      const updateCarField = useCallback((carId, field, value) => {
        setDirtyIds(prev => new Set([...prev, carId]));
        setData(prev => ({
          ...prev,
          cars: prev.cars.map(c => c.id === carId ? { ...c, [field]: value } : c)
        }));
      }, []);

      const addQuestion = useCallback((q) => {
        setConfigDirty(true);
        setData(prev => ({ ...prev, questions: [...prev.questions, q] }));
      }, []);

      const deleteQuestion = useCallback((qIdx) => {
        setConfigDirty(true);
        setData(prev => ({
          ...prev,
          questions: prev.questions.filter((_, i) => i !== qIdx)
        }));
      }, []);

      const handleSaveConfig = useCallback(async () => {
        if (!pat) throw new Error("No GitHub token configured");
        const configData = { targetSpec: data.targetSpec, questions: data.questions };
        await saveConfigToGitHub(configData, pat);
        setConfigDirty(false);
      }, [data, pat]);

      // Car-specific question handlers
      const cycleCarQuestionStatus = useCallback((carId, qIdx) => {
        setDirtyIds(prev => new Set([...prev, carId]));
        setData(prev => ({
          ...prev,
          cars: prev.cars.map(c => {
            if (c.id !== carId) return c;
            const newQuestions = (c.questions || []).map((q, i) =>
              i === qIdx
                ? { ...q, status: STATUS_CYCLE[(STATUS_CYCLE.indexOf(q.status) + 1) % STATUS_CYCLE.length] }
                : q
            );
            return { ...c, questions: newQuestions };
          })
        }));
      }, []);

      const deleteCarQuestion = useCallback((carId, qIdx) => {
        setDirtyIds(prev => new Set([...prev, carId]));
        setData(prev => ({
          ...prev,
          cars: prev.cars.map(c => {
            if (c.id !== carId) return c;
            const newQuestions = (c.questions || []).filter((_, i) => i !== qIdx);
            return { ...c, questions: newQuestions };
          })
        }));
      }, []);

      const updateCarNotes = useCallback((carId, text) => {
        setDirtyIds(prev => new Set([...prev, carId]));
        setData(prev => ({
          ...prev,
          cars: prev.cars.map(c =>
            c.id === carId ? { ...c, carNotes: text } : c
          )
        }));
      }, []);

      const addCarQuestion = useCallback((carId, q) => {
        setDirtyIds(prev => new Set([...prev, carId]));
        setData(prev => ({
          ...prev,
          cars: prev.cars.map(c =>
            c.id === carId
              ? { ...c, questions: [...(c.questions || []), q] }
              : c
          )
        }));
      }, []);

      const handleSaveToGitHub = useCallback(async (carId) => {
        const car = data.cars.find(c => c.id === carId);
        if (!car) throw new Error("Car not found");
        if (!pat) throw new Error("No GitHub token configured");
        await saveCarToGitHub(car, pat);
        // Update original snapshot and clear dirty
        setOriginalCars(prev => prev.map(c => c.id === carId ? { ...JSON.parse(JSON.stringify(car)), images: c.images } : c));
        setDirtyIds(prev => { const next = new Set(prev); next.delete(carId); return next; });
      }, [data, pat]);

      if (error) return <div className="container" style={{ color: "var(--red)", padding: 40 }}>Error: {error}</div>;
      if (!data) return <div className="container" style={{ padding: 40 }}>Loading...</div>;

      return (
        <div>
          <div className="header-bar">
            <h1>Alphard Tracker</h1>
            <p>Toyota Alphard 20-series import search</p>
            <div className="header-actions">
              <button
                className={`gh-settings-btn${pat ? " connected" : ""}`}
                onClick={() => setShowGhSettings(true)}
              >
                {pat ? "GitHub: Connected" : "Connect GitHub"}
              </button>
              <button className="reset-link" onClick={() => {
                if (confirm("Reset all edits back to the original data?")) {
                  localStorage.removeItem(STORAGE_KEY);
                  location.reload();
                }
              }}>Reset to original data</button>
            </div>
            {showGhSettings && (
              <GitHubSettingsModal
                currentPat={pat}
                onSave={setPatState}
                onClose={() => setShowGhSettings(false)}
              />
            )}
          </div>
          <div className="container">
            <div className="tabs">
              <button className={`tab ${tab === "cars" ? "active" : ""}`} onClick={() => setTab("cars")}>Cars Considered</button>
              <button className={`tab ${tab === "questions" ? "active" : ""}`} onClick={() => setTab("questions")}>Outstanding Questions</button>
              <button className={`tab ${tab === "specs" ? "active" : ""}`} onClick={() => setTab("specs")}>Specs</button>
              <button className={`tab ${tab === "trims" ? "active" : ""}`} onClick={() => setTab("trims")}>Trims</button>
              <button className={`tab ${tab === "target" ? "active" : ""}`} onClick={() => setTab("target")}>Target Spec</button>
            </div>

            {tab === "cars" && data.cars.map(car => (
              <CarCard key={car.id} car={car} onVerdictCycle={cycleVerdict} onSetCover={setCover} onDeleteImage={deleteImage} onUpdateField={updateCarField} isDirty={dirtyIds.has(car.id)} onSaveToGitHub={handleSaveToGitHub} hasPat={!!pat} onCarQuestionStatusCycle={cycleCarQuestionStatus} onAddCarQuestion={addCarQuestion} onDeleteCarQuestion={deleteCarQuestion} onUpdateCarNotes={updateCarNotes} />
            ))}

            {tab === "questions" && (
              <QuestionsTab questions={data.questions} onStatusCycle={cycleStatus} onAddQuestion={addQuestion} onDeleteQuestion={deleteQuestion} onSaveConfig={handleSaveConfig} hasPat={!!pat} configDirty={configDirty} />
            )}

            {tab === "specs" && <SpecsTab />}

            {tab === "trims" && <TrimsTab />}

            {tab === "target" && <TargetSpecTab specs={data.targetSpec} />}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
